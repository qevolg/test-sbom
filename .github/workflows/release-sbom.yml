name: Release SBOM

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      # cdx format
      SBOM_FILENAME: "${{ github.event.repository.name }}-release-sbom.cdx.json"
      # spdx format
      # SBOM_FILENAME: "${{ github.event.repository.name }}-sbom.spdx.json
    steps:
      - uses: actions/checkout@v6

      # By default, this action will execute a Syft scan in the workspace directory
      # and upload a workflow artifact SBOM in SPDX format. It will also detect if
      # being run during a GitHub release and upload the SBOM as a release asset.
      #
      # https://github.com/marketplace/actions/anchore-sbom-action
      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          # cdx format
          format: cyclonedx-json
          # spdx format
          # format: spdx-json
          output-file: "${{ env.SBOM_FILENAME }}"
          artifact-name: "${{ env.SBOM_FILENAME }}"

      # https://github.com/marketplace/actions/anchore-container-scan
      - name: Scan SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: "${{ env.SBOM_FILENAME }}"
          cache-db: true
          output-format: "table"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: "${{ env.SBOM_FILENAME }}"
